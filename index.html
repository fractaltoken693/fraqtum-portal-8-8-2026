        <!-- Minimal Footer with Trademark -->
        <footer class="glass-panel border-t border-gold-500/20 py-8 px-4 mt-12 text-center font-mono text-xs text-gold-400">
            <div class="font-bold text-sm tracking-wide">
                Asociación Nacional de Educación Financiera Fractal™
            </div>
        </footer>

    </div>

    <!-- STREAMING_CHUNK:Initializing Sacred Toroid Geometry Engine... -->
    <script>
        // Sacred Toroid & Golden Fibonacci Spiral Engine
        const canvas = document.getElementById('fractal-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initCosmos();
        });

        // Golden Ratio Constant
        const PHI = (1 + Math.sqrt(5)) / 2; // ~1.6180339887

        // Cosmic background elements
        let stars = [];
        let shootingStars = [];
        let stardust = [];

        function initCosmos() {
            stars = [];
            stardust = [];
            shootingStars = [];
            
            // Deep background stars
            const numStars = Math.floor((width * height) / 2500);
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.2 + 0.3,
                    alpha: Math.random() * 0.8 + 0.1,
                    speed: Math.random() * 0.02 + 0.005,
                    color: Math.random() > 0.8 ? '#FFD54F' : '#E2E8F0'
                });
            }

            // Stardust (glowing ambient particles)
            const numDust = Math.floor((width * height) / 8000);
            for (let i = 0; i < numDust; i++) {
                stardust.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 3 + 1,
                    alpha: Math.random() * 0.4 + 0.1,
                    pulseSpeed: Math.random() * 0.03 + 0.01,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }
        initCosmos();

        function spawnShootingStar() {
            if (Math.random() > 0.98) {
                shootingStars.push({
                    x: Math.random() * width * 1.5,
                    y: -50,
                    length: Math.random() * 100 + 50,
                    speedX: -(Math.random() * 10 + 5),
                    speedY: Math.random() * 10 + 5,
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.01
                });
            }
        }

        let time = 0;
        let mouseX = width / 2;
        let mouseY = height / 2;
        let targetCx = width / 2;
        let targetCy = height * 0.48;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // Helper function to draw a delicate Golden Mandala Petal
        function drawMandalaPetal(ctx, rInner, rOuter, petalWidthAngle) {
            ctx.beginPath();
            ctx.moveTo(0, -rInner);
            ctx.bezierCurveTo(
                petalWidthAngle * rOuter * 1.3, -rInner * 1.2,
                petalWidthAngle * rOuter * 0.9, -rOuter * 0.8,
                0, -rOuter
            );
            ctx.bezierCurveTo(
                -petalWidthAngle * rOuter * 0.9, -rOuter * 0.8,
                -petalWidthAngle * rOuter * 1.3, -rInner * 1.2,
                0, -rInner
            );
            ctx.closePath();
        }

        // Helper function to draw a torus-like overlapping weave
        function drawTorusWeave(ctx, radius, loops, rotationAngle) {
            ctx.save();
            ctx.rotate(rotationAngle);
            ctx.strokeStyle = 'rgba(212, 175, 55, 0.15)';
            ctx.lineWidth = 1;
            
            for (let i = 0; i < loops; i++) {
                ctx.save();
                ctx.rotate((Math.PI * 2 / loops) * i);
                ctx.beginPath();
                ctx.ellipse(0, -radius * 0.5, radius * 0.2, radius * 0.6, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
            ctx.restore();
        }

        // Helper function to draw sacred geometry mandala ring
        function drawMandalaRing(ctx, radius, petalCount, rotationAngle, strokeColor, fillColor, glowColor, intricate = false) {
            ctx.save();
            ctx.rotate(rotationAngle);
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 1;

            if (glowColor) {
                ctx.shadowColor = glowColor;
                ctx.shadowBlur = 15;
            }

            for (let i = 0; i < petalCount; i++) {
                ctx.save();
                ctx.rotate((Math.PI * 2 / petalCount) * i);
                
                // Main Petal
                drawMandalaPetal(ctx, radius * 0.6, radius, 0.4);
                if (fillColor) {
                    ctx.fillStyle = fillColor;
                    ctx.fill();
                }
                ctx.stroke();

                if (intricate) {
                    // Inner intricate petal
                    drawMandalaPetal(ctx, radius * 0.65, radius * 0.9, 0.2);
                    ctx.stroke();
                    
                    // Sacred point
                    ctx.beginPath();
                    ctx.arc(0, -radius * 0.95, 2, 0, Math.PI * 2);
                    ctx.fillStyle = glowColor;
                    ctx.fill();
                }

                // Connecting arches
                ctx.beginPath();
                ctx.arc(0, 0, radius * 0.75, -Math.PI / petalCount, Math.PI / petalCount);
                ctx.stroke();

                ctx.restore();
            }

            ctx.restore();
        }

        /* STREAMING_CHUNK:Rendering Frame Animation Loop... */
        function renderScene() {
            time += 0.003;

            // Deep cosmic torus background gradient
            const bgGrad = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, Math.max(width, height) * 0.9);
            bgGrad.addColorStop(0, '#110F18'); // Slightly purple/deep space core
            bgGrad.addColorStop(0.4, '#0B0D14');
            bgGrad.addColorStop(1, '#030406');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // Render Cosmos
            // 1. Static Stars
            for (let star of stars) {
                star.alpha += Math.sin(time * 5 + star.x) * 0.01;
                const currentAlpha = Math.max(0.1, Math.min(0.9, star.alpha));
                ctx.fillStyle = star.color;
                ctx.globalAlpha = currentAlpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            // 2. Glowing Stardust
            for (let dust of stardust) {
                const alpha = (Math.sin(time * dust.pulseSpeed + dust.phase) + 1) / 2 * dust.alpha;
                ctx.fillStyle = `rgba(212, 175, 55, ${alpha})`;
                ctx.shadowColor = '#FFD54F';
                ctx.shadowBlur = dust.size * 2;
                ctx.beginPath();
                ctx.arc(dust.x, dust.y, dust.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // 3. Shooting Stars
            spawnShootingStar();
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                let ss = shootingStars[i];
                ss.x += ss.speedX;
                ss.y += ss.speedY;
                ss.alpha -= ss.decay;

                if (ss.alpha <= 0) {
                    shootingStars.splice(i, 1);
                    continue;
                }

                const grad = ctx.createLinearGradient(ss.x, ss.y, ss.x - ss.speedX * 4, ss.y - ss.speedY * 4);
                grad.addColorStop(0, `rgba(255, 255, 255, ${ss.alpha})`);
                grad.addColorStop(1, `rgba(212, 175, 55, 0)`);

                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(ss.x, ss.y);
                ctx.lineTo(ss.x - ss.speedX * 4, ss.y - ss.speedY * 4);
                ctx.stroke();
            }

            // Smooth parallax interaction
            const destCx = width / 2 + (mouseX - width / 2) * 0.04;
            const destCy = height * 0.48 + (mouseY - height / 2) * 0.04;
            targetCx += (destCx - targetCx) * 0.05;
            targetCy += (destCy - targetCy) * 0.05;

            const baseRadius = Math.min(width, height) * 0.42;

            ctx.save();
            ctx.translate(targetCx, targetCy);

            // Torus / Mandala Breathing effect
            const breath = Math.sin(time * 1.5) * 0.03 + 1;

            // 1. Deep Torus Weave (Background structure)
            drawTorusWeave(ctx, baseRadius * 1.3, 48, time * 0.1);
            drawTorusWeave(ctx, baseRadius * 1.1, 36, -time * 0.15);

            // 2. Multi-layered Sacred Toroidal Mandala (48, 32, 24, 12, 8)
            // Outer Toroidal Layer
            drawMandalaRing(
                ctx, 
                baseRadius * 1.1 * breath, 
                48, 
                time * 0.2, 
                'rgba(212, 175, 55, 0.15)', 
                'rgba(212, 175, 55, 0.01)',
                'rgba(212, 175, 55, 0.2)'
            );

            // Mid-Outer Layer (Intricate)
            drawMandalaRing(
                ctx, 
                baseRadius * 0.85, 
                32, 
                -time * 0.3, 
                'rgba(255, 213, 79, 0.25)', 
                'rgba(212, 175, 55, 0.02)',
                'rgba(255, 213, 79, 0.3)',
                true
            );

            // Middle Layer
            drawMandalaRing(
                ctx, 
                baseRadius * 0.6, 
                24, 
                time * 0.5, 
                'rgba(255, 230, 130, 0.4)', 
                'rgba(255, 213, 79, 0.03)',
                'rgba(255, 215, 0, 0.4)'
            );

            // Inner Star Layer
            drawMandalaRing(
                ctx, 
                baseRadius * 0.35 * breath, 
                12, 
                -time * 0.8, 
                'rgba(255, 249, 230, 0.6)', 
                'rgba(212, 175, 55, 0.05)',
                'rgba(255, 249, 230, 0.6)',
                true
            );

            // 3. Central Golden Toroidal Spiral
            ctx.save();
            ctx.rotate(time * 0.8);
            ctx.beginPath();
            const spiralTurns = 16 * Math.PI;
            const a = baseRadius * 0.005;
            const b = 0.12; 

            // Dual interwoven spirals for torus feel
            for (let i = 0; i < 2; i++) {
                ctx.rotate(Math.PI); // offset second spiral
                ctx.beginPath();
                for (let theta = 0; theta < spiralTurns; theta += 0.05) {
                    const r = a * Math.exp(b * theta);
                    if (r > baseRadius * 0.8) break;

                    const x = r * Math.cos(theta);
                    const y = r * Math.sin(theta);

                    if (theta === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.strokeStyle = i === 0 ? 'rgba(255, 230, 130, 0.8)' : 'rgba(255, 213, 79, 0.5)';
                ctx.lineWidth = 2.5;
                ctx.shadowColor = '#FFD54F';
                ctx.shadowBlur = 20;
                ctx.stroke();
            }
            ctx.restore();

            // 4. Luminous Cosmic Core
            const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, baseRadius * 0.25);
            coreGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
            coreGrad.addColorStop(0.1, 'rgba(255, 249, 230, 0.8)');
            coreGrad.addColorStop(0.4, 'rgba(255, 213, 79, 0.4)');
            coreGrad.addColorStop(0.8, 'rgba(212, 175, 55, 0.1)');
            coreGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = coreGrad;
            ctx.beginPath();
            ctx.arc(0, 0, baseRadius * 0.25, 0, Math.PI * 2);
            ctx.fill();

            // Core singularity point
            const singularityPulse = Math.sin(time * 5) * 2 + 3;
            ctx.fillStyle = '#FFFFFF';
            ctx.shadowColor = '#FFFFFF';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(0, 0, singularityPulse, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            requestAnimationFrame(renderScene);
        }

        // Start animation after DOM load
        window.onload = function() {
            renderScene();
        };
    </script>
</body>
